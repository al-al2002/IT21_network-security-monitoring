# Render Blueprint — deploys NetGuard as one free web service that runs the
# Express API + Socket.io and serves the built React client.
# In Render: New -> Blueprint -> pick this repo. See README "Deploy to Render".
services:
  - type: web
    name: netguard
    runtime: node
    plan: free
    buildCommand: cd server && npm ci && cd ../client && npm ci && npm run build
    startCommand: cd server && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # MongoDB Atlas connection string. Entered in the Render dashboard, never
      # committed. Atlas Network Access must allow 0.0.0.0/0, because Render's
      # free instances have no fixed outbound IP.
      - key: MONGO_URI
        sync: false
      # Random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Which proxies may report the visitor's IP, so login events record the
      # visitor rather than a proxy. Requests reach the app through Cloudflare
      # and then Render's internal proxies on private addresses, so trust
      # exactly those: Cloudflare's published ranges plus private ranges. An
      # ordinary visitor is neither, so they cannot spoof their IP.
      - key: TRUST_PROXY
        value: "loopback, linklocal, uniquelocal, cloudflare"
      - key: EVENT_SOURCE
        value: replay
      # Auto-delete events older than 7 days (MongoDB TTL index), so the
      # replay's ~50,000 events a day cannot fill the free 512 MB Atlas cluster.
      # Threats and incidents are kept.
      - key: EVENT_RETENTION_DAYS
        value: "7"
